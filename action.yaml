name: "Verify GitHub Workflows"
description: "Verify the GitHub Workflows using actionlint and zizmor"

author: "Thibaut Durand"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  paths:
    description: >
      Newline-separated list of workflow files to verify. Paths are passed as is (no glob
      expansion: glob patterns are not expanded, spaces are preserved). Empty (default)
      verifies the workflows in `.github/workflows`.
    required: false
    default: ""

  actionlint:
    description: >
      Whether to run actionlint, a static checker for GitHub Actions
      workflow files. Set to "false" to disable.
    required: false
    default: "true"

  actionlint-version:
    description: >
      Version of actionlint to install, `x.y.z` or `latest`. The default is pinned and
      bumped on each release of this action.
    required: false
    default: "1.7.12"

  actionlint-flags:
    description: "Additional flags to pass to actionlint"
    required: false
    default: ""

  zizmor:
    description: >
      Whether to run zizmor, a security-focused static analyzer for
      GitHub Actions workflows. Set to "false" to disable.
    required: false
    default: "true"

  zizmor-version:
    description: >
      Version of zizmor to install, `x.y.z` or `latest`. The default is pinned and
      bumped on each release of this action.
    required: false
    default: "1.32.0"

  zizmor-flags:
    description: >
      Additional flags to pass to zizmor. The action adds `--format=github` (inline
      annotations) unless the flags contain `--format`.
    required: false
    default: ""

  github-token:
    description: >
      GitHub token passed to zizmor as `GH_TOKEN` to enable its online audits. Optional.
      The workflow token (`github.token`) is enough (needs `contents: read` and `actions: read`).
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Validate the booleans, create a private tool directory outside the checkout and
    # put it on the PATH
    - name: Prepare
      id: prepare
      shell: bash
      env:
        ACTIONLINT: ${{ inputs.actionlint }}
        ZIZMOR: ${{ inputs.zizmor }}
      run: |
        set -euo pipefail
        for pair in "actionlint=$ACTIONLINT" "zizmor=$ZIZMOR"; do
          case "${pair#*=}" in
            true | false) ;;
            *)
              echo "::error::input '${pair%%=*}' must be 'true' or 'false', got '${pair#*=}'"
              exit 1
              ;;
          esac
        done
        mkdir -p "$RUNNER_TEMP/verify-workflows/bin"
        echo "$RUNNER_TEMP/verify-workflows/bin" >> "$GITHUB_PATH"

    # Download the official installer script (pinned to the v1.7.12 commit) to a file, so a
    # download error fails the step, install actionlint into the tool directory, then run it
    - name: actionlint
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.actionlint == 'true' }}
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        ACTIONLINT_FLAGS: ${{ inputs.actionlint-flags }}
        VERIFY_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        echo "🔍 actionlint ${ACTIONLINT_VERSION}"

        bin_dir="$RUNNER_TEMP/verify-workflows/bin"
        installer_url="https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash"
        installer="$RUNNER_TEMP/verify-workflows/download-actionlint.bash"
        curl -fsSL -o "$installer" "$installer_url"
        bash "$installer" "$ACTIONLINT_VERSION" "$bin_dir"

        # Tokenize flags with xargs (honors quoting) without re-parsing them as shell code.
        # Skipped when empty: GNU and BSD xargs disagree on the tokens of an empty string.
        flags=()
        if [ -n "$ACTIONLINT_FLAGS" ]; then
          while IFS= read -r flag; do flags+=("$flag"); done < <(xargs -n1 <<< "$ACTIONLINT_FLAGS")
        fi

        # One path per line, spaces preserved. No path: actionlint discovers .github/workflows.
        targets=()
        while IFS= read -r path; do
          if [ -n "$path" ]; then targets+=("$path"); fi
        done <<< "$VERIFY_PATHS"

        # Marker for the tests: actionlint was started
        touch "$RUNNER_TEMP/verify-workflows/ran-actionlint"

        # ${arr[@]+...}: bash 3.2 (macOS) fails on an empty array under set -u
        "$bin_dir/actionlint" ${flags[@]+"${flags[@]}"} ${targets[@]+"${targets[@]}"}

    # Run zizmor through pipx (isolated from the global Python environment) with inline
    # annotations, and optionally a token for the online audits. It runs even if actionlint
    # failed, so one run reports the findings of both tools
    - name: zizmor
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.zizmor == 'true' }}
      shell: bash
      env:
        ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
        ZIZMOR_FLAGS: ${{ inputs.zizmor-flags }}
        VERIFY_PATHS: ${{ inputs.paths }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        echo "🔍 zizmor ${ZIZMOR_VERSION}"

        if ! command -v pipx > /dev/null; then
          echo "::error::pipx is required to run zizmor but was not found on this runner"
          exit 1
        fi
        spec="zizmor"
        if [ "$ZIZMOR_VERSION" != "latest" ]; then spec="zizmor==${ZIZMOR_VERSION}"; fi

        # Recent zizmor releases need Python >= 3.11, which some runners (ubuntu-22.04) lack
        # as the default: use the newest one found, else let pipx download one
        pipx_python=(--python 3.12 --fetch-python=missing)
        for py in python3.14 python3.13 python3.12 python3.11 python3; do
          if command -v "$py" > /dev/null \
            && "$py" -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
            pipx_python=(--python "$py")
            break
          fi
        done

        flags=()
        if [ -n "$ACTIONLINT_FLAGS" ]; then
          while IFS= read -r flag; do flags+=("$flag"); done < <(xargs -n1 <<< "$ACTIONLINT_FLAGS")
        fi

        # One path per line, spaces preserved. No path: actionlint discovers .github/workflows.
        targets=()
        while IFS= read -r path; do
          if [ -n "$path" ]; then targets+=("$path"); fi
        done <<< "$VERIFY_PATHS"

        # Marker for the tests: actionlint was started
        touch "$RUNNER_TEMP/verify-workflows/ran-actionlint"

        # ${arr[@]+...}: bash 3.2 (macOS) fails on an empty array under set -u
        "$bin_dir/actionlint" ${flags[@]+"${flags[@]}"} ${targets[@]+"${targets[@]}"}

    # Run zizmor through pipx (isolated from the global Python environment) with inline
    # annotations, and optionally a token for the online audits. It runs even if actionlint
    # failed, so one run reports the findings of both tools
    - name: zizmor
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.zizmor == 'true' }}
      shell: bash
      env:
        ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
        ZIZMOR_FLAGS: ${{ inputs.zizmor-flags }}
        VERIFY_PATHS: ${{ inputs.paths }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        echo "🔍 zizmor ${ZIZMOR_VERSION}"

        if ! command -v pipx > /dev/null; then
          echo "::error::pipx is required to run zizmor but was not found on this runner"
          exit 1
        fi
        spec="zizmor"
        if [ "$ZIZMOR_VERSION" != "latest" ]; then spec="zizmor==${ZIZMOR_VERSION}"; fi

        # Recent zizmor releases need Python >= 3.11, which some runners (ubuntu-22.04) lack
        # as the default: use the newest one found, else let pipx download one
        pipx_python=(--python 3.13 --fetch-missing-python)
        for v in 3.13 3.12 3.11; do
          if command -v "python${v}" > /dev/null; then pipx_python=(--python "python${v}"); break; fi
        done

        flags=()
        if [ -n "$ZIZMOR_FLAGS" ]; then
          while IFS= read -r flag; do flags+=("$flag"); done < <(xargs -n1 <<< "$ZIZMOR_FLAGS")
        fi

        # Annotate the PR unless the user chose a format
        has_format=false
        for flag in ${flags[@]+"${flags[@]}"}; do
          case "$flag" in --format | --format=*) has_format=true ;; esac
        done
        if [ "$has_format" = false ]; then flags+=("--format=github"); fi

        # An empty token makes zizmor fail: only pass it when set
        if [ -z "$GH_TOKEN" ]; then unset GH_TOKEN; fi

        # zizmor needs an explicit input: default to the workflows directory
        targets=()
        while IFS= read -r path; do
          if [ -n "$path" ]; then targets+=("$path"); fi
        done <<< "$VERIFY_PATHS"
        if [ "${#targets[@]}" -eq 0 ]; then targets=(".github/workflows"); fi

        # Marker for the tests: zizmor was started
        touch "$RUNNER_TEMP/verify-workflows/ran-zizmor"

        pipx run "${pipx_python[@]}" --spec "$spec" zizmor ${flags[@]+"${flags[@]}"} "${targets[@]}"
