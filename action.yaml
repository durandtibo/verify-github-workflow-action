name: "Verify GitHub Workflows"
description: "Verify the GitHub Workflows using actionlint and zizmor"

author: "Thibaut Durand"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  paths:
    description: >
      Newline-separated list of workflow files to verify. Paths are passed as is (no glob
      expansion, spaces are preserved). Empty (default) verifies the workflows in
      `.github/workflows`.
    required: false
    default: ""

  actionlint:
    description: >
      Whether to run actionlint, a static checker for GitHub Actions
      workflow files. Set to "false" to disable.
    required: false
    default: "true"

  actionlint-version:
    description: "Version of actionlint to install (default: latest)"
    required: false
    default: "latest"

  actionlint-flags:
    description: "Additional flags to pass to actionlint"
    required: false
    default: ""

  zizmor:
    description: >
      Whether to run zizmor, a security-focused static analyzer for
      GitHub Actions workflows. Set to "false" to disable.
    required: false
    default: "true"

  zizmor-version:
    description: "Version of zizmor to install (default: latest)"
    required: false
    default: "latest"

  zizmor-flags:
    description: "Additional flags to pass to zizmor"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Create a private tool directory outside the checkout and put it on the PATH
    - name: Prepare
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/verify-workflows/bin"
        echo "$RUNNER_TEMP/verify-workflows/bin" >> "$GITHUB_PATH"

    # Install actionlint with the official installer script (pinned to the v1.7.12 commit)
    # into the tool directory, then run it
    - name: actionlint
      if: inputs.actionlint == 'true'
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.actionlint-version }}
        ACTIONLINT_FLAGS: ${{ inputs.actionlint-flags }}
        VERIFY_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        echo "🔍 actionlint ${ACTIONLINT_VERSION}"

        bin_dir="$RUNNER_TEMP/verify-workflows/bin"
        installer="https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash"
        bash <(curl -fsSL "$installer") "$ACTIONLINT_VERSION" "$bin_dir" > /dev/null

        # Tokenize flags with xargs (honors quoting) without re-parsing them as shell code.
        # Skipped when empty: GNU and BSD xargs disagree on the tokens of an empty string.
        flags=()
        if [ -n "$ACTIONLINT_FLAGS" ]; then
          while IFS= read -r flag; do flags+=("$flag"); done < <(xargs -n1 <<< "$ACTIONLINT_FLAGS")
        fi

        # One path per line, spaces preserved. No path: actionlint discovers .github/workflows.
        targets=()
        while IFS= read -r path; do
          if [ -n "$path" ]; then targets+=("$path"); fi
        done <<< "$VERIFY_PATHS"

        # ${arr[@]+...}: bash 3.2 (macOS) fails on an empty array under set -u
        "$bin_dir/actionlint" ${flags[@]+"${flags[@]}"} ${targets[@]+"${targets[@]}"}

    # Run zizmor through pipx (isolated from the global Python environment), then run it
    - name: zizmor
      if: inputs.zizmor == 'true'
      shell: bash
      env:
        ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
        ZIZMOR_FLAGS: ${{ inputs.zizmor-flags }}
        VERIFY_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        echo "🔍 zizmor ${ZIZMOR_VERSION}"

        if ! command -v pipx > /dev/null; then
          echo "::error::pipx is required to run zizmor but was not found on this runner"
          exit 1
        fi
        spec="zizmor"
        if [ "$ZIZMOR_VERSION" != "latest" ]; then spec="zizmor==${ZIZMOR_VERSION}"; fi

        flags=()
        if [ -n "$ZIZMOR_FLAGS" ]; then
          while IFS= read -r flag; do flags+=("$flag"); done < <(xargs -n1 <<< "$ZIZMOR_FLAGS")
        fi

        # zizmor needs an explicit input: default to the workflows directory
        targets=()
        while IFS= read -r path; do
          if [ -n "$path" ]; then targets+=("$path"); fi
        done <<< "$VERIFY_PATHS"
        if [ "${#targets[@]}" -eq 0 ]; then targets=(".github/workflows"); fi

        pipx run --spec "$spec" zizmor ${flags[@]+"${flags[@]}"} "${targets[@]}"
