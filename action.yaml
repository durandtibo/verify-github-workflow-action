name: "Verify GitHub Workflows"
description: "Verify the GitHub Workflows using actionlint"

author: "Thibaut Durand"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  paths:
    description: >
      Paths or glob patterns to workflow files.
      Defaults to `.github/workflows/*`
    required: false
    default: ".github/workflows/*"

  version:
    description: "Version of actionlint to install (default: latest)"
    required: false
    default: "latest"

  flags:
    description: "Additional flags to pass to actionlint"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Download and install actionlint using the official installer script
    - name: Install actionlint
      id: install
      shell: bash
      env:
        ACTIONLINT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        echo "📦 Installing actionlint ${ACTIONLINT_VERSION}..."

        ACTIONLINT_URL="https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash"
        bash <(curl -sSL "$ACTIONLINT_URL") "$ACTIONLINT_VERSION"

    # Verify that actionlint was installed correctly
    - name: Verify actionlint installation
      shell: bash
      env:
        ACTIONLINT_EXECUTABLE: ${{ steps.install.outputs.executable }}
      run: |
        set -euo pipefail
        if [ -f "$ACTIONLINT_EXECUTABLE" ]; then
          echo "✅ actionlint installed successfully"
          "$ACTIONLINT_EXECUTABLE" --version
        else
          echo "❌ actionlint installation failed"
          exit 1
        fi

    # Run actionlint against workflow files
    - name: Run actionlint on workflow files
      shell: bash
      env:
        ACTIONLINT_EXECUTABLE: ${{ steps.install.outputs.executable }}
        ACTIONLINT_FLAGS: ${{ inputs.flags }}
        ACTIONLINT_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        echo "🔍 Running actionlint on GitHub workflows..."

        # shellcheck disable=SC2086
        "$ACTIONLINT_EXECUTABLE" $ACTIONLINT_FLAGS $ACTIONLINT_PATHS

        echo "✅ All workflows verified successfully!"
