# Workflow testing the action from the current repository code (uses: ./)
# on multiple operating systems and with different input combinations.

name: Test Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify GitHub Workflows
        uses: ./

  test-inputs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      # Custom paths, versions and flags
      - name: Verify GitHub Workflows
        uses: ./
        with:
          paths: ".github/workflows/*.yaml"
          actionlint-version: "1.7.9"
          actionlint-flags: "-format '{{json .}}'"
          zizmor-version: "1.14.0"
          zizmor-flags: "--no-progress"

  test-actionlint-disabled:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      # Only zizmor runs
      - name: Verify GitHub Workflows
        uses: ./
        with:
          actionlint: "false"

  test-zizmor-disabled:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      # Only actionlint runs
      - name: Verify GitHub Workflows
        uses: ./
        with:
          zizmor: "false"

  test-all-disabled:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      # Nothing runs, the action must still succeed
      - name: Verify GitHub Workflows
        uses: ./
        with:
          actionlint: "false"
          zizmor: "false"
