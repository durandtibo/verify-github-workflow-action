# Workflow testing the latest released action, to catch regressions in what consumers pick up
# on multiple operating systems. ci-action.yaml tests the current checkout instead.
# It currently covers only the simplest cases, with the inputs of the pinned v0.0.3
# release (`version`, `flags`, glob paths), which differ from the current inputs.
# Mirror the cases of ci-action.yaml and update the pinned release when v0.1.0 is released.

name: Test Released Action
on:
  workflow_call:
    inputs:
      test-matrix:
        description: "JSON test matrix from lib-get-test-matrix.yaml, loaded once by the caller"
        required: true
        type: string

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test-matrix).os_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify GitHub Workflows
        uses: durandtibo/verify-github-workflow-action@e5dc341675711838a82b2433f70a225858ad70d1 # ratchet:durandtibo/verify-github-workflow-action@v0.0.3

  test-inputs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      # Custom paths, version and flags
      - name: Verify GitHub Workflows
        uses: durandtibo/verify-github-workflow-action@e5dc341675711838a82b2433f70a225858ad70d1 # ratchet:durandtibo/verify-github-workflow-action@v0.0.3
        with:
          paths: ".github/workflows/*.yaml"
          version: "1.7.9"
          flags: "-format '{{json .}}'"
